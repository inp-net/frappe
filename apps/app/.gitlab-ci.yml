.reviewdog_setup: &reviewdog_setup curl -sfL https://raw.githubusercontent.com/reviewdog/reviewdog/master/install.sh | sh -s -- -b /bin

.app:
  image: node:latest
  needs:
    - job: build:api
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  before_script:
    - *reviewdog_setup
    - cp .env.ci .env
    - cd apps/app
    - corepack enable
    - pnpm i --frozen-lockfile
    - pnpm generate

build:app:
  extends: .app
  stage: build
  script:
    - pnpm build

lint:app:
  extends: .app
  stage: test
  script:
    - pnpm exec eslint . -f rdjson | reviewdog -f=rdjson -name="eslint" -reporter=gitlab-mr-discussion -level=error
    - |
      pnpm exec prettier --check . 2>&1 | awk '/\[warn\]/ { print $2 ":1:1: File is not properly formatted." }' | reviewdog -efm="%f:%l:%c: %m" -name="prettier" -reporter=gitlab-mr-discussion -filter-mode=nofilter

check:app:
  extends: .app
  stage: test
  script:
    - pnpm exec svelte-kit sync
    - pnpm exec svelte-check --tsconfig ./tsconfig.json

release:app:
  extends: .docker
  stage: release
  interruptible: false
  needs:
    - job: build:api
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        TAG: export TAG=$(echo $CI_COMMIT_TAG)
        PUSH: "true"
        TARGET: app
